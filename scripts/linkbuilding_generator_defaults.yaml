# Default site vocabulary for generate_paragraph_linkbuilding.py.
#
# These values reproduce the generator's behaviour from before the site config
# existed (they were hard-coded for FlowHunt). A site overrides them by adding
# data/linkbuilding/generator.yaml to its Hugo root with the same keys
# (--generator-config). A key present there replaces the default list wholesale;
# keys left out keep the values below. The run log prints which config was used.
#
# brand_terms            the site's own brand words. An anchor made only of brand
#                        and generic words is rejected, and a target keyword made
#                        only of brand, generic and function words earns no
#                        exact-keyword bonus.
# generic_terms          words that never make an anchor specific to its target.
# shortcode_param_names  shortcode parameter names, lower-case. A paragraph that
#                        mentions two of them is leaked markup, not prose (any
#                        `name="` inside a paragraph is rejected regardless).
# nav_path_patterns      regular expressions matched (case-insensitive, re.search)
#                        against the canonical URL path. Pages that match neither
#                        receive nor emit links, on top of the built-in list
#                        (/login, /search, /cart, /checkout, /contact, /privacy…).
# stopwords.source       builtin      the generator's English list for every language
#                                     and the edge-only window rule (the behaviour
#                                     before the site config existed)
#                        file         data/linkbuilding/stopwords/<lang>.toml with
#                                     `words = ["der", "die", ...]`; directory
#                                     configurable with stopwords.dir. Also switches
#                                     on the strict rule for short anchor windows
#                                     (no stopword anywhere in a phrase of up to
#                                     three content words).
#                        Keep the lists to function words (articles, prepositions,
#                        conjunctions, pronouns, auxiliaries), 50-200 words per
#                        language. Off-the-shelf lists such as stopwords-iso are far
#                        too broad for anchor filtering (its English list has 1 298
#                        words including help, system, information, work); use them
#                        at most as raw material for a curated file.
#                        A language without a list falls back to the English list;
#                        the run log names the source for every language.
# stopwords.extra        words added on top of the source per language,
#                        e.g. { de: [bzw], sk: [resp] }
# cjk_languages          content language codes written without spaces between
#                        words, mapped to their script: ja (Japanese) or zh
#                        (Chinese). HTML path (--public-dir) only: a paragraph counts
#                        CJK characters instead of words, clauses also split on CJK
#                        punctuation, and anchors are only the target's own keywords /
#                        title / slug found verbatim in a clause (at most 6 estimated words,
#                        two or more words, not all of them brand / generic / function
#                        words), never word windows. Words are split by
#                        fugashi + unidic-lite (ja) or jieba (zh), see linkbuilding_cjk.py.
#                        A label with a symbol is never an anchor, the katakana middle
#                        dot included (ナレッジ・ベース "knowledge base"). The default
#                        covers the ISO codes (ja, zh) and LiveAgent's (jp, zh-hans).
# cjk_multiword_terms    CJK labels of two or more words that the segmenter reads as
#                        one dictionary word, e.g. チケッティングシステム (ticketing system).
# cjk_one_word_terms     CJK labels of one word that the segmenter cuts in two, e.g.
#                        电子邮件 (e-mail): dropped as a whole label, but an ordinary
#                        word inside a longer one (电子邮件自动化 "e-mail automation").

brand_terms: [flowhunt, ai, mcp, llm]

generic_terms:
  - flowhunt
  - copilot
  - ai
  - mcp
  - llm
  - tool
  - tools
  - agent
  - agents
  - automation
  - workflow
  - workflows
  - platform
  - chatbot
  - chatbots
  - ready
  - use
  - using
  - help
  - helps
  - key
  - point
  - points
  - inside
  - paste
  - better
  - best
  - create
  - build
  - make
  - content
  - page
  - pages
  - guide
  - learn
  - need
  - needs
  - feature
  - features
  - text
  - title
  - image
  - images
  - link
  - links
  - button

shortcode_param_names: [imaged, imagealt, linktext, categorycolor, primarycta]

nav_path_patterns: []

stopwords:
  source: builtin
  extra: {}

cjk_languages: {ja: ja, jp: ja, zh: zh, zh-hans: zh}

cjk_multiword_terms: []

cjk_one_word_terms: []
