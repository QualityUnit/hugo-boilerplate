# Unit and fixture tests for the linkbuilding scripts (scripts/generate_paragraph_linkbuilding.py,
# scripts/linkbuilding_frontmatter.py and their helpers), shared by every site on this theme.
# Fast (about a minute): no embedding model, the tests use a fake embedder.
#
# No path filter on purpose: the check is meant to be required for merging, and a
# required check that a path filter skips stays "expected" and blocks the PR.
name: Linkbuilding tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkbuilding-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: linkbuilding tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.11 = the Python of the LiveAgent linkbuilding and deploy workflows.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/linkbuilding/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r tests/linkbuilding/requirements.txt

      # -B: no .pyc files from the test run (scripts/__pycache__ also holds tracked ones).
      - name: Run tests
        run: python -B -m unittest discover -s tests/linkbuilding -t tests/linkbuilding -v
