# Preferred internal-link targets for the semantic linkbuilding generator
# (themes/boilerplate/scripts/generate_paragraph_linkbuilding.py).
#
# Why this file exists
# -------------------
# The generator pairs paragraphs with target pages by embedding similarity.
# With the standard floors (similarity 0.52 / lift 0.015 / anchor 0.34) a
# paragraph about, say, an out-of-office template never gets close enough to
# "help desk software" to earn a link. Result: high-traffic editorial pages
# (/templates/, /academy/, /customer-support-glossary/) carry 19-22 body links
# and 0-3 of them point at a product page, while product pages sit at GSC
# position 41-53 with millions of impressions and double-digit clicks.
#
# Pages listed here get:
#   - a score boost (fit + weight * score_boost) when ordering candidates, and
#   - relaxed floors, but ONLY until the source page has `min_links_per_page`
#     preferred links. After that the normal floors apply again, so this does
#     not flood pages with product links.
#
# Format
# ------
# `file` is the path relative to content/<lang>/ and is matched per language,
# so one entry covers every language that has the same filename (verified:
# de es fr it nl pl sk pt-br ru all use these filenames). `url` / `path` are
# also accepted but only ever match one language, so prefer `file`.
# `weight` multiplies `score_boost` — it tilts ordering between preferred
# targets, it does not change the floors.
#
# Add per-language-only targets under a `languages:` mapping, e.g.
#   languages:
#     de:
#       - file: some-de-only-page.md
#         weight: 1.0
# Language entries are appended AFTER `targets`, and the combined list is cut
# off at `max_targets_per_language` — keep headroom below the cap.
#
# Ranked by GSC impressions, 16 months to 2026-08-24 (data/exports/gsc/).
# The list was reviewed and approved by marketing on 2026-08-25 — including the
# three "free" pages, which were flagged explicitly and kept. Do not drop or add
# entries without running the change past them again.
# See docs/linkbuilding-handover-2026-08-25.md for the full context.

settings:
  # Every source page tries to earn at least this many preferred links.
  min_links_per_page: 1
  # Hard cap on preferred targets per language (targets + languages combined).
  max_targets_per_language: 20
  # Added to the similarity score as `weight * score_boost` when ordering.
  score_boost: 0.08
  # Relaxed floors, applied only while a page is below min_links_per_page.
  similarity_floor: 0.46
  lift_floor: -0.05
  anchor_floor: 0.38

